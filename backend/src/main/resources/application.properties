server.port=8080
server.forward-headers-strategy=framework
spring.application.name=satya-certificate-system

# ==========================================
# DATABASE (MYSQL OR POSTGRESQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ==========================================
# SERVER LIMITS
# ==========================================

server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# APPLICATION URLS
# ==========================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}

# ==========================================
# ADMIN LOGIN
# ==========================================

app.admin-email=${ADMIN_EMAIL:admin@example.com}
app.admin-default-password=${ADMIN_PASSWORD:change_this_password}

# ==========================================
# JWT
# ==========================================

app.jwt-secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET}
app.jwt-expiration-ms=86400000

# ==========================================
# GMAIL SMTP
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==========================================
# GOOGLE OAUTH2
# ==========================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ==========================================
# GITHUB OAUTH2
# ==========================================

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# ==========================================
# RAZORPAY
# ==========================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}